<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xiaomi Note 15 5G — EMI Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#12141A;--panel:#1B1E26;--line:#2B2F3A;--orange:#FF6A13;--green:#39C97A;--amber:#F2B84B;--text:#F1F2F5;--muted:#8B92A3}
  html[data-theme="light"]{--bg:#F5F4F1;--panel:#FFFFFF;--line:#E4E2DC;--orange:#E85D0A;--green:#1E9A5A;--amber:#B8791C;--text:#1B1C1F;--muted:#75757C}
  *{box-sizing:border-box}html,body{margin:0;padding:0}
  body{background:radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,106,19,0.12), transparent 60%),var(--bg);color:var(--text);font-family:'IBM Plex Sans', sans-serif;min-height:100vh;display:flex;justify-content:center;padding:56px 20px 80px}
  .page{width:100%;max-width:480px}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}
  .brand .device{font-family:'Archivo', sans-serif;font-weight:700;font-size:15px}
  .brand .right{display:flex;align-items:center;gap:14px}
  .brand .tenor{font-family:'IBM Plex Mono', monospace;font-size:12px;color:var(--muted)}
  .theme-toggle{width:38px;height:22px;border-radius:999px;background:var(--panel);border:1px solid var(--line);position:relative;cursor:pointer}
  .theme-toggle .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--orange);transition:transform 0.2s}
  html[data-theme="light"] .theme-toggle .knob{transform:translateX(16px)}
  .hero{position:relative;display:flex;justify-content:center;padding:18px 0 8px}
  .glow{position:absolute;width:280px;height:280px;top:6px;border-radius:50%;background:radial-gradient(circle, rgba(255,106,19,0.32), transparent 70%);filter:blur(6px)}
  .phone-wrap{position:relative;z-index:1;width:200px;height:340px}
  .phone-photo{display:block;width:100%;height:100%;object-fit:contain}
  .headline{text-align:center;margin:26px 0 4px}
  .headline h1{font-family:'Archivo', sans-serif;font-weight:700;font-size:24px;margin:0}
  .headline p{margin:8px 0 0;font-size:14px;color:var(--muted)}
  .strip-label{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:34px 0 10px}
  .strip-label span:last-child{font-family:'IBM Plex Mono', monospace;color:var(--text)}
  .strip{display:grid;grid-template-columns:repeat(12, 1fr);gap:4px}
  .cell{height:28px;border-radius:4px;background:var(--panel);border:1px solid var(--line);transition:all 0.3s}
  .cell.paid{background:linear-gradient(180deg, #3ED686, var(--green));border-color:var(--green)}
  .cell.current{border-color:var(--orange);box-shadow:inset 0 0 0 2px var(--orange)}
  .months-labels{display:grid;grid-template-columns:repeat(12, 1fr);margin-top:6px}
  .months-labels span{font-size:9px;color:var(--muted);text-align:center;font-family:'IBM Plex Mono', monospace}
  .stats{display:flex;margin:40px 0 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat{flex:1;padding:20px 4px;text-align:center;border-right:1px solid var(--line)}
  .stat:last-child{border-right:none}
  .stat .num{font-family:'Archivo', sans-serif;font-weight:800;font-size:30px}
  .stat.paid .num{color:var(--green)}
  .stat.due .num{color:var(--amber)}
  .stat .lbl{margin-top:6px;font-size:11px;color:var(--muted)}
  .amount-row{display:flex;justify-content:space-between;padding:16px 2px 0;font-size:13px;color:var(--muted)}
  .amount-row b{font-family:'IBM Plex Mono', monospace;color:var(--text);font-size:14px}
  .cta{display:block;width:100%;margin-top:34px;padding:16px 0;text-align:center;background:var(--orange);color:#161208;font-family:'Archivo', sans-serif;font-weight:700;font-size:15px;border:none;border-radius:8px;cursor:pointer}
  .cta:hover{background:#FF7B2E}
  .cta:disabled{background:var(--muted);cursor:not-allowed}
  .note{margin-top:14px;text-align:center;font-size:11.5px;color:var(--muted)}
  .note code{background:var(--panel);padding:1px 5px;border-radius:4px;font-family:'IBM Plex Mono', monospace}
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center}
  .modal.show{display:flex}
  .modal-content{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:420px}
  .modal-header{text-align:center;margin-bottom:28px}
  .modal-header h2{font-family:'Archivo', sans-serif;font-weight:700;font-size:22px;margin:0 0 6px}
  .modal-header p{margin:0;font-size:13px;color:var(--muted)}
  .form-group{margin-bottom:22px}
  .form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}
  .form-group select,.form-group input{width:100%;padding:14px 16px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);font-size:15px}
  .modal-actions{display:flex;gap:12px;margin-top:28px}
  .btn{flex:1;padding:14px 20px;border:none;border-radius:8px;font-family:'Archivo', sans-serif;font-weight:700;font-size:15px;cursor:pointer}
  .btn-primary{background:var(--orange);color:#161208}
  .btn-secondary{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .error-detail{background:#2a1a1a;border:1px solid #ff4444;border-radius:8px;padding:12px;margin-top:12px;font-size:11px;color:#ff6b6b;font-family:'IBM Plex Mono',monospace;display:none}
  #toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%, 20px);background:var(--panel);border:1px solid var(--line);padding:12px 18px;border-radius:8px;font-size:13px;opacity:0;transition:all 0.25s;pointer-events:none;z-index:2000}
  #toast.show{opacity:1;transform:translate(-50%, 0)}
</style>
</head>
<body>

<div class="page">
  <div class="brand">
    <div class="device">Note 15 · 5G</div>
    <div class="right">
      <span class="tenor">EMI TRACKER</span>
      <button class="theme-toggle" id="themeToggle"><span class="knob"></span></button>
    </div>
  </div>

  <div class="hero">
    <div class="glow"></div>
    <div class="phone-wrap">
      <img class="phone-photo" id="phonePhoto" src="https://www.nextpit.de/img/xiaomi-redmi-note-15-5g-vorderseite.webp">
    </div>
  </div>

  <div class="headline">
    <h1>Xiaomi Note 15 5G</h1>
    <p>Installment plan · August 2026 – July 2027</p>
  </div>

  <div class="strip-label">
    <span>12-month plan</span>
    <span id="progressText">0 / 12 paid</span>
  </div>
  <div class="strip" id="strip"></div>
  <div class="months-labels" id="monthsLabels"></div>

  <div class="stats">
    <div class="stat total"><div class="num" id="totalNum">12</div><div class="lbl">Total EMI</div></div>
    <div class="stat paid"><div class="num" id="paidNum">0</div><div class="lbl">Paid EMI</div></div>
    <div class="stat due"><div class="num" id="dueNum">12</div><div class="lbl">Due EMI</div></div>
  </div>

  <div class="amount-row"><span>Paid so far</span><b id="amountPaid">৳0</b></div>
  <div class="amount-row"><span>Paid through</span><b id="paidThrough">—</b></div>

  <button class="cta" id="payBtn">Pay next EMI</button>
  <p class="note">Records to Google Sheets | Copyright by <code>Md. Shohidul Islam</code></p>
</div>

<div class="modal" id="paymentModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Record EMI Payment</h2>
      <p>Update your payment status</p>
    </div>
    <form id="emiForm">
      <div class="form-group">
        <label>Select Month</label>
        <select id="monthSelect" required>
          <option value="Aug-26">August 2026</option><option value="Sep-26">September 2026</option>
          <option value="Oct-26">October 2026</option><option value="Nov-26">November 2026</option>
          <option value="Dec-26">December 2026</option><option value="Jan-27">January 2027</option>
          <option value="Feb-27">February 2027</option><option value="Mar-27">March 2027</option>
          <option value="Apr-27">April 2027</option><option value="May-27">May 2027</option>
          <option value="Jun-27">June 2027</option><option value="Jul-27">July 2027</option>
        </select>
      </div>
      <div class="form-group">
        <label>Taka (Amount)</label>
        <input type="number" id="takaInput" value="3084" required>
      </div>
      <div id="errorDetail" class="error-detail"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="submitBtn">Submit Payment</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
  // Production Webhooks
  const PAY_URL = "https://madam.app.n8n.cloud/webhook/pay-emi";
  const STATUS_URL = "https://madam.app.n8n.cloud/webhook/emi-status";
  
  const MONTHS = ["Aug'26","Sep'26","Oct'26","Nov'26","Dec'26","Jan'27","Feb'27","Mar'27","Apr'27","May'27","Jun'27","Jul'27"];

  // Theme Toggle
  document.getElementById('themeToggle').addEventListener('click', () => {
    document.documentElement.setAttribute('data-theme', 
      document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  // Modal Logic
  const modal = document.getElementById('paymentModal');
  document.getElementById('payBtn').addEventListener('click', () => {
    const today = new Date();
    // getMonth() === 8 মানে সেপ্টেম্বর মাস এবং getDate() <= 7 মানে ১-৭ তারিখ
    if (today.getMonth() === 8 && today.getDate() >= 1 && today.getDate() <= 7) {
      modal.classList.add('show');
    } else {
      alert("Lock! Open next month");
    }
  });
  function closeModal() { 
    modal.classList.remove('show');
    document.getElementById('errorDetail').style.display = 'none';
  }
  modal.addEventListener('click', (e) => { if(e.target === modal) closeModal(); });

  function formatMonth(raw) {
    if(!raw) return '—';
    const [name, yy] = raw.split('-');
    return name + ' 20' + yy;
  }

  // Render UI Data
  function render(paid, totalTaka, lastMonth) {
    document.getElementById('paidNum').textContent = paid;
    document.getElementById('dueNum').textContent = 12 - paid;
    document.getElementById('progressText').textContent = paid + ' / 12 paid';
    document.getElementById('amountPaid').textContent = '৳' + Number(totalTaka).toLocaleString();
    document.getElementById('paidThrough').textContent = formatMonth(lastMonth);

    const strip = document.getElementById('strip');
    const labels = document.getElementById('monthsLabels');
    strip.innerHTML = ''; labels.innerHTML = '';
    
    MONTHS.forEach((m, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell' + (i < paid ? ' paid' : '') + (i === paid && i < 12 ? ' current' : '');
      strip.appendChild(cell);
      
      const lbl = document.createElement('span');
      lbl.textContent = m;
      labels.appendChild(lbl);
    });
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Fetch initial data from Sheet2 via GET Webhook on page load
  async function loadInitialData() {
    try {
      const res = await fetch(STATUS_URL, { method: 'GET' });
      if(res.ok) {
        const data = await res.json();
        render(data.paid || 0, data.totalTaka || 0, data.last_month);
      } else {
        render(0, 0, null);
      }
    } catch(err) {
      console.error('Initial load error:', err);
      render(0, 0, null);
    }
  }

  // Submit payment data to Sheet2 via POST Webhook
  document.getElementById('emiForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const month = document.getElementById('monthSelect').value;
    const taka = document.getElementById('takaInput').value;
    const btn = document.getElementById('submitBtn');
    const errorDetail = document.getElementById('errorDetail');
    
    btn.textContent = 'Processing...';
    btn.disabled = true;
    errorDetail.style.display = 'none';

    try {
      const res = await fetch(PAY_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({month, taka})
      });
      
      const responseText = await res.text();
      
      if(!res.ok) {
        throw new Error(`HTTP ${res.status}: ${responseText}`);
      }
      if(!responseText.trim()) {
        throw new Error('Empty response from n8n');
      }
      
      const data = JSON.parse(responseText);
      
      render(data.paid || 0, data.totalTaka || 0, data.last_month);
      showToast('✓ Payment recorded!');
      closeModal();
      
    } catch(err) {
      console.error('❌ Error:', err);
      errorDetail.textContent = 'Error: ' + err.message;
      errorDetail.style.display = 'block';
      showToast('✗ Payment failed');
    }
    
    btn.textContent = 'Submit Payment';
    btn.disabled = false;
  });

  // Initialize data on load
  loadInitialData();
</script>
</body>
</html>
